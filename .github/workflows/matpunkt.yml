# Extern mätpunkt för systematlasens kontrollmotor (fas C). Mall: lägg den som
# .github/workflows/matpunkt.yml i det publika GitHub-repot (se verktyg/extern/README.md).
#
# Kör motorn i externt läge (bara kontroller med räckvidd publik-atkomst) var 15:e minut
# och lägger resultatet som senaste.json på grenen "resultat". kk-server hämtar filen med
# extern_hamta.py. Inga hemligheter: bara repots egen GITHUB_TOKEN med contents: write.
name: matpunkt

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # GitHub kör schemat ungefärligt; motorn godtar mätningar upp till 60 min
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matpunkt
  cancel-in-progress: false

jobs:
  mat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Hämta motorn och den publika kontrollspecifikationen
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0
        with:
          persist-credentials: false

      - name: Kör kontrollerna utifrån
        # Exit 1 betyder att någon kontroll är FEL. Resultatet ska ändå publiceras.
        run: python3 -I motor.py --extern --spec kontrollspec-publik.json --resultat ut || test $? -eq 1

      - name: Publicera resultatet på grenen resultat
        env:
          GH_TOKEN: ${{ github.token }}
        # En enda commit som skrivs över varje gång: grenen växer inte och historiken är inte intressant.
        run: |
          mkdir pub && cp ut/senaste.json pub/senaste.json && cd pub
          git init -q -b resultat
          git add senaste.json
          git -c user.name=matpunkt -c user.email=matpunkt@users.noreply.github.com \
            commit -q -m "Extern mätning $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" resultat
